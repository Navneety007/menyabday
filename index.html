<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbe4ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Menya's Birthdayyayie</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="phase-loading">

  <!-- dreamy background -->
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>
  <canvas id="bokeh" aria-hidden="true"></canvas>

  <!-- music toggle -->
  <button id="musicBtn" class="music-btn" aria-label="Pause music" hidden>
    <span class="bars"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- heart scroll thread -->
  <div class="thread" aria-hidden="true"><div class="thread-fill"></div><div class="thread-heart">♥</div></div>

  <!-- 1. secret code -->
  <section id="lock" class="screen lock" aria-label="Secret code">
    <div class="lock-deco" aria-hidden="true"></div>
    <div class="lock-inner">
      <div class="hearts-pair">
        <div class="heart-frame hf-left"></div>
        <div class="heart-frame hf-right"></div>
      </div>
      <div class="pad-wrap">
        <h1 class="lock-title script"><span data-text="lock.title"></span> <span class="beat">💗</span></h1>
        <div class="slots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
        <p class="lock-msg" data-text="lock.hint"></p>
        <div class="keypad">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button data-k="del" aria-label="Delete"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <button data-k="0">0</button>
          <button data-k="ok" class="ok" aria-label="Enter">♥</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. the gift -->
  <section id="gift" class="screen gift" aria-label="A gift">
    <button class="gift-btn" aria-label="Open the gift">
      <svg id="giftSvg" viewBox="0 0 220 220" aria-hidden="true"></svg>
    </button>
    <h1 class="gift-title script write" data-text="gift.title"></h1>
    <p class="gift-hint hand" data-text="gift.hint"></p>
  </section>

  <!-- 3. flower bloom -->
  <canvas id="flowers" aria-hidden="true"></canvas>
  <div class="flash" aria-hidden="true"></div>

  <!-- 4. the story -->
  <main id="story" class="story">
    <section class="intro chapter">
      <h1 class="intro-title script write" data-text="intro.title"></h1>
      <p class="intro-sub hand" data-text="intro.subtitle"></p>
      <div class="scroll-hint hand"><span>scroll slowly</span><svg viewBox="0 0 24 40" width="18"><rect x="2" y="2" width="20" height="36" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle class="wheel" cx="12" cy="11" r="2.6" fill="currentColor"/></svg></div>
    </section>

    <div id="chapters"></div>

    <section class="finale chapter">
      <h1 class="finale-title script write" data-text="finale.title"></h1>
      <p class="finale-sub hand" data-text="finale.subtitle"></p>
      <button class="replay hand" data-text="finale.replay"></button>
    </section>
  </main>

  <!-- photo viewer -->
  <div class="lightbox" aria-hidden="true">
    <figure class="lb-card"><div class="lb-img"></div><figcaption class="hand"></figcaption></figure>
  </div>

  <div id="fx" aria-hidden="true"></div>

  <script src="content.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/music.js"></script>
  <script src="assets/flowers.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
